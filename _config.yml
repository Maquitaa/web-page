title: "DataShield Consulting"
tagline: "Cumplimiento modular para la nueva ley de datos."
description: "Consultoría modular y plataforma de cumplimiento para empresas chilenas sujetas a la Ley 21.719 de Protección de Datos Personales."
# Idioma/región para jekyll-seo-tag (og:locale). Sin esto, el plugin usa en_US
# por defecto para og:locale, aunque el <html lang="es"> del layout diga otra cosa.
lang: "es"
locale: "es_CL"

url: "https://datashieldconsulting.cl"
baseurl: ""


# Autor / empresa
author:
  name: "DataShield Consulting"
  #email: "contacto@datashieldconsulting.cl"
  email: "ricardo.soto@datashieldconsulting.cl"
  location: "Chile"

# Contacto / CTA (WhatsApp, email de agendamiento, etc.)
contact:
  whatsapp_numero: "56940059372"
  whatsapp_mensaje: "Hola, quiero agendar un diagnóstico con DataShield"
  email_cc: "macarena.soto@datashieldconsulting.cl"
  email_asunto: "Solicitud de Diagnóstico"
  email_cuerpo: "Hola equipo de DataShield Consulting,\n\nMe gustaría agendar un diagnóstico de cumplimiento para evaluar la situación de mi empresa frente a la Ley 21.719.\n\nMis datos de contacto:\n\nNombre: \nEmpresa: \nCargo: \nTeléfono: \nHorario preferente de contacto: \n\nMensaje adicional:\n\n\nSaludos cordiales."

# Redes sociales
social:
  linkedin: "#"
  twitter: "#"

# Colores y marca (para referencia, el CSS los define)
brand:
  year: "MMXXVI"
  tagline_mono: "Ley 21.719 · GDPR chileno"

# Jekyll
markdown: kramdown
kramdown:
  input: GFM

# Plugins compatibles con GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Excluir del build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - .git/

# Sass
sass:
  style: compressed
