<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO básico -->
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>

  <!-- La descripción (meta description, og:description) y og:title/og:type/og:locale/og:url
       las genera jekyll-seo-tag más abajo con {% seo %}. Ese tag resuelve la descripción con
       esta prioridad: page.description → page.excerpt (campo "Resumen" del admin) →
       site.description. No la dupliques manualmente aquí: si hay dos <meta name="description">
       o dos <meta property="og:description">, los navegadores y los crawlers de redes
       sociales suelen quedarse con la primera que encuentran en el <head>. -->

  <!-- og:image / twitter:image: se define aquí explícitamente (en vez de dejarlo solo
       en manos de {% seo %}) para poder declarar el ancho/alto junto a la imagen,
       tal como recomienda Open Graph. Sale de page.image, que es el campo "Imagen
       destacada" que se sube desde /admin/ y que Decap guarda en assets/img/posts/. -->
  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ page.image | absolute_url }}">
  {% endif %}

  <!-- Seguridad via meta tags (complementa los headers HTTP) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Tipografías: Fraunces + Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="{{ '/assets/img/logo.png' | relative_url }}">
  <link rel="dns-prefetch" href="//formspree.io">

  <!-- CSS principal -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Jekyll SEO tag (genera meta adicional automáticamente) -->
  {% seo %}

  <!-- Favicon -->
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}" type="image/png" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0J6G0J4G34"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0J6G0J4G34');
  </script>
</head>

<body>

  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  {% include nav.html %}

  <main id="main-content">
    {{ content }}
  </main>


  <!-- JS principal -->
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

</body>
</html>
